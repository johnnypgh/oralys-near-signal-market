[package]
name = "oralys-signal-market-v2"
version = "0.1.0"
edition = "2021"
description = "Pay-per-signal market on NEAR: buyer agents pay for signed transcript quality signals"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
